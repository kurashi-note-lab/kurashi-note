<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="暮らしの小さな整理ノートのカテゴリ一覧。住まい、生活管理、デジタル整理の記事、テンプレート、ツールへの入口です。"><title>カテゴリ一覧</title><link rel="stylesheet" href="../assets/style.css"></head><body><header><div class="brand"><a href="../index.html">暮らしの小さな整理ノート</a></div><h1>カテゴリ</h1><p class="lead">記事、テンプレート、ミニツールを目的別にまとめています。まずは今困っている場所に近いカテゴリから選んでください。</p></header><main><div class="grid"><div class="card"><h2><a href="small-home-systems.html">小さな住まいの仕組み</a></h2><p>部屋、机、玄関などを短時間で戻すためのカテゴリ。週末15分リセットの記事、チェックリスト、手順メーカーへ進めます。</p></div><div class="card"><h2><a href="life-admin.html">生活管理</a></h2><p>郵便物、説明書、レシートなどを止めずに分けるカテゴリ。3箱ルール、印刷ラベル、ラベル作成ツールをまとめています。</p></div><div class="card"><h2><a href="digital-decluttering.html">デジタル整理</a></h2><p>スマホ写真やスクリーンショットを月1回だけ見直すカテゴリ。記事とチェック表から始められます。</p></div></div></main><footer><p><a href="../index.html">トップへ戻る</a></p></footer></body></html>
