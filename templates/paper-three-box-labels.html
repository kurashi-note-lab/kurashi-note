<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="書類を今すぐ対応、保管、確認待ちに分けるための3箱ラベル案です。印刷してそのまま使えます。">
  <title>書類3箱ラベル</title>
  <link rel="stylesheet" href="../assets/style.css">
</head>
<body>
<header>
  <div class="brand"><a href="../index.html">暮らしの小さな整理ノート</a></div>
  <h1>書類3箱ラベル</h1>
  <p class="lead">紙の山を「次の行動」で分けるための固定ラベルです。迷ったら、この3箱だけを先に貼ります。</p>
  <nav class="nav" aria-label="関連ページ">
    <a href="../articles/paper-sorting-three-box-rule.html">使い方の記事へ</a>
    <a href="../tools/paper-label-maker.html">文面を調整する</a>
    <a href="../categories/life-admin.html">生活管理</a>
  </nav>
</header>
<main>
  <section class="card">
    <h2>印刷用ラベル</h2>
    <textarea readonly>書類3箱ラベル

[今すぐ対応]
入れる物: 支払い / 返信 / 提出 / 記入
確認日:
次にやること:

[保管]
入れる物: 保証書 / 契約書 / 取扱説明書 / 残す書類
保管場所:
見直し予定:

[確認待ち]
入れる物: 迷う書類 / 内容確認 / 期限不明
次に見る日:
確認すること:</textarea>
    <h2>向いている使い方</h2>
    <ul>
      <li>郵便物を開けたあと、一度テーブルに積んでしまう。</li>
      <li>説明書や保証書の置き場所が毎回変わる。</li>
      <li>捨ててよいか迷う紙が棚や引き出しに残りやすい。</li>
    </ul>
    <p class="note">置き場所や確認日を入れた文面にしたい場合は、<a href="../tools/paper-label-maker.html">書類仕分けラベル作成ツール</a>で作れます。</p>
    <button class="btn no-print" onclick="window.print()">印刷</button>
  </section>
</main>
<footer>
  <p><a href="../articles/paper-sorting-three-box-rule.html">記事へ</a><a href="../tools/paper-label-maker.html">ラベル作成ツール</a><a href="index.html">テンプレート一覧へ</a></p>
</footer>
</body>
</html>
