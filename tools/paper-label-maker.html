<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="description" content="書類を今すぐ対応、保管、確認待ちに分ける3箱ラベルを、このページ内だけで作る静的ツールです。"><title>書類仕分けラベル作成ツール</title><link rel="stylesheet" href="../assets/style.css"><style>.tool-grid{display:grid;gap:16px}@media(min-width:820px){.tool-grid{grid-template-columns:.9fr 1.1fr;align-items:start}}label{display:block;font-weight:700;margin:12px 0 6px}input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;background:#fff;color:var(--text)}.checks label{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:8px 0}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}button{min-height:44px;border:0;border-radius:6px;background:var(--accent);color:#fff;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}button.secondary{background:#514d46}.label-sheet{display:grid;gap:12px}.paper-label{border:2px solid var(--text);background:#fff;border-radius:6px;padding:14px;min-height:150px}.paper-label h2{margin-top:0;font-size:1.2rem}.small{color:var(--muted);font-size:.94rem}@media print{header,.input-panel,footer,.no-print{display:none!important}main{max-width:none;padding:0}.tool-grid{display:block}.card{border:0;padding:0}.paper-label{break-inside:avoid;margin-bottom:10mm}}</style></head><body><header><div class="brand"><a href="../index.html">暮らしの小さな整理ノート</a></div><h1>書類仕分けラベル作成ツール</h1><p class="lead">3つの箱やトレーに貼るラベルを、置き場所と確認日に合わせて作ります。外部送信や保存は行いません。</p><nav class="nav" aria-label="関連ページ"><a href="../articles/paper-sorting-three-box-rule.html">3箱ルールの記事へ</a><a href="../templates/paper-three-box-labels.html">固定テンプレートへ</a><a href="../categories/life-admin.html">生活管理へ</a></nav></header><main class="tool-grid"><section class="card input-panel" aria-labelledby="input-title"><h2 id="input-title">入力</h2><label for="place">置き場所</label><input id="place" type="text" maxlength="40" placeholder="例: 机の左、玄関棚、リビングの棚"><label for="review_day">次に見る日</label><select id="review_day"><option value="今週末">今週末</option><option value="日曜の夕方">日曜の夕方</option><option value="月末">月末</option><option value="月初">月初</option><option value="未定">未定</option></select><label for="tone">ラベルの言い方</label><select id="tone"><option value="plain">標準</option><option value="short">短め</option><option value="family">家族にも伝わる</option></select><div class="checks"><label><input id="include_examples" type="checkbox" checked> 入れる物の例を表示する</label><label><input id="include_next_action" type="checkbox" checked> 次の行動欄を入れる</label></div><div class="actions"><button id="generate" type="button">ラベルを作る</button><button id="copy" type="button" class="secondary">コピー</button><button id="print" type="button" class="secondary">印刷</button></div><p id="status" class="small" aria-live="polite">個人情報や契約番号は入力しないでください。</p></section><section class="card" aria-labelledby="output-title"><h2 id="output-title">出力</h2><div id="labels" class="label-sheet"></div><label for="copy_text" class="no-print">コピペ用テキスト</label><textarea id="copy_text" readonly class="no-print"></textarea></section></main><footer><p><a href="../index.html">トップへ戻る</a><a href="../privacy.html">プライバシー方針</a><a href="../disclaimer.html">免責事項</a><a href="../contact.html">問い合わせ</a></p><p>このツールはブラウザ内だけで動く静的ページです。入力内容は送信、保存されません。</p></footer><script>(function(){'use strict';var boxes=[{title:'今すぐ対応',examples:'支払い / 返信 / 提出 / 記入',action:'次にやることを書く'},{title:'保管',examples:'保証書 / 契約書 / 取扱説明書 / 残す書類',action:'保管場所を決める'},{title:'確認待ち',examples:'迷う書類 / 期限不明 / 内容確認が必要な紙',action:'次に見る日を決める'}];function text(id){return document.getElementById(id).value.trim()}function checked(id){return document.getElementById(id).checked}function escapeHtml(value){return value.replace(/[&<>"']/g,function(ch){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]})}function lead(title,tone){if(tone==='short')return title;if(tone==='family')return title+' - ここに入れる';return title+'の箱'}function render(){var place=text('place')||'置き場所を決める';var day=text('review_day');var tone=text('tone');var includeExamples=checked('include_examples');var includeNextAction=checked('include_next_action');var html='';var copy=[];boxes.forEach(function(box){var title=lead(box.title,tone);html+='<section class="paper-label"><h2>'+escapeHtml(title)+'</h2>';html+='<p><strong>置き場所:</strong> '+escapeHtml(place)+'</p>';html+='<p><strong>次に見る日:</strong> '+escapeHtml(day)+'</p>';if(includeExamples)html+='<p><strong>入れる物:</strong> '+escapeHtml(box.examples)+'</p>';if(includeNextAction)html+='<p><strong>次の行動:</strong> '+escapeHtml(box.action)+'</p>';html+='</section>';var lines=[title,'置き場所: '+place,'次に見る日: '+day];if(includeExamples)lines.push('入れる物: '+box.examples);if(includeNextAction)lines.push('次の行動: '+box.action);copy.push(lines.join('\n'))});document.getElementById('labels').innerHTML=html;document.getElementById('copy_text').value=copy.join('\n\n---\n\n')}function copyText(){var target=document.getElementById('copy_text');var status=document.getElementById('status');if(!target.value)render();if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(target.value).then(function(){status.textContent='コピーしました。'}).catch(function(){target.focus();target.select();status.textContent='自動コピーできませんでした。テキスト欄を手動でコピーしてください。'})}else{target.focus();target.select();status.textContent='この環境では手動コピーを使ってください。'}}document.getElementById('generate').addEventListener('click',render);document.getElementById('copy').addEventListener('click',copyText);document.getElementById('print').addEventListener('click',function(){window.print()});render()})();</script></body></html>
