<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="スマホ写真とスクリーンショットの月1見直しメモを、このページ内だけで作る静的ツールです。外部送信や保存は行いません。">
  <title>写真見直しメモ作成ツール | 暮らしの小さな整理ノート</title>
  <link rel="stylesheet" href="../assets/style.css">
  <style>
    .tool-grid{display:grid;gap:16px}
    @media(min-width:820px){.tool-grid{grid-template-columns:.92fr 1.08fr;align-items:start}}
    label{display:block;font-weight:700;margin:12px 0 6px}
    input,select{width:100%;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:9px 10px;font:inherit;background:#fff;color:var(--text)}
    .checks label{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:8px 0}
    .actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
    button{min-height:44px;border:0;border-radius:6px;background:var(--accent);color:#fff;padding:10px 14px;font:inherit;font-weight:700;cursor:pointer}
    button.secondary{background:#514d46}
    .output-list label{display:flex;gap:8px;align-items:flex-start;font-weight:500;margin:8px 0}
    .small{color:var(--muted);font-size:.94rem}
    .tool-next{grid-column:1/-1}
    @media print{header,.input-panel,footer,.no-print{display:none!important}main{max-width:none;padding:0}.tool-grid{display:block}.card{border:0;padding:0}}
  </style>
</head>
<body>
<header>
  <div class="brand"><a href="../index.html">暮らしの小さな整理ノート</a></div>
  <h1>写真見直しメモ作成ツール</h1>
  <p class="lead">月1回の写真整理で見る場所と残す判断を小さくまとめます。入力内容は外部送信も保存もしません。</p>
  <nav class="nav" aria-label="関連ページ">
    <a href="../articles/monthly-smartphone-photo-organizing.html">写真整理の記事へ</a>
    <a href="../templates/monthly-photo-organizing-checklist.html">月1チェック表へ</a>
    <a href="../categories/digital-decluttering.html">デジタル整理へ</a>
  </nav>
</header>
<main class="tool-grid">
  <section class="card input-panel" aria-labelledby="input-title">
    <h2 id="input-title">入力</h2>
    <label for="month">対象月</label>
    <input id="month" type="text" maxlength="20" placeholder="例: 5月、2026年5月">
    <label for="focus">今月いちばん見るもの</label>
    <select id="focus">
      <option value="screenshots">スクリーンショット</option>
      <option value="documents">手続き控え・予約画面</option>
      <option value="shopping">買い物メモ</option>
      <option value="memories">思い出写真</option>
      <option value="mixed">全体を軽く</option>
    </select>
    <label for="time">使える時間</label>
    <select id="time">
      <option value="10">10分</option>
      <option value="15" selected>15分</option>
      <option value="25">25分</option>
    </select>
    <div class="checks">
      <label><input id="include_album" type="checkbox" checked> あとで見るアルバムを作る</label>
      <label><input id="include_delete" type="checkbox" checked> 削除候補を最後に確認する</label>
      <label><input id="include_next" type="checkbox" checked> 次回見る日を決める</label>
    </div>
    <label for="memo">メモ 60文字以内</label>
    <input id="memo" type="text" maxlength="60" placeholder="例: 旅行写真は残す">
    <div class="actions">
      <button id="generate" type="button">メモを作る</button>
      <button id="copy" type="button" class="secondary">コピー</button>
      <button id="print" type="button" class="secondary">印刷</button>
    </div>
    <p id="status" class="small" aria-live="polite">個人情報、予約番号、書類番号は入力しないでください。</p>
  </section>
  <section class="card" aria-labelledby="output-title">
    <h2 id="output-title">出力</h2>
    <div id="result"></div>
    <label for="copy_text" class="no-print">コピー用テキスト</label>
    <textarea id="copy_text" readonly class="no-print"></textarea>
  </section>
  <section class="card tool-next">
    <h2>次に使うページ</h2>
    <p>メモを作ったら、月1回の見直し手順を記事で確認し、見る場所と削除候補はチェック表に残しておくと迷いにくくなります。</p>
    <p class="nav"><a href="../articles/monthly-smartphone-photo-organizing.html">記事を読む</a><a href="../templates/monthly-photo-organizing-checklist.html">チェック表を使う</a><a href="../categories/digital-decluttering.html">カテゴリへ戻る</a></p>
  </section>
</main>
<footer>
  <p><a href="../index.html">トップへ戻る</a><a href="../privacy.html">プライバシー方針</a><a href="../disclaimer.html">免責事項</a><a href="../contact.html">問い合わせ</a></p>
  <p>このツールはブラウザ内だけで動く静的ページです。入力内容は送信、保存されません。</p>
</footer>
<script>
(function(){
  'use strict';
  var focusNames={screenshots:'スクリーンショット',documents:'手続き控え・予約画面',shopping:'買い物メモ',memories:'思い出写真',mixed:'全体を軽く'};
  var firstStep={screenshots:'スクリーンショットを新しい順に見る',documents:'手続き控えと予約画面を先に見る',shopping:'買い物メモを必要・不要に分ける',memories:'残したい写真を先に選ぶ',mixed:'最近1か月分だけを見る'};
  function el(id){return document.getElementById(id)}
  function checked(id){return el(id).checked}
  function clean(value){return value.replace(/[<>]/g,'').trim()}
  function build(){
    var month=clean(el('month').value)||'今月';
    var focus=el('focus').value;
    var time=el('time').value;
    var memo=clean(el('memo').value);
    var steps=[firstStep[focus]];
    if(checked('include_album'))steps.push('迷うものは「あらためて見る」アルバムに入れる');
    steps.push('残す理由を、思い出・記録・買い物・手続きに分ける');
    if(checked('include_delete'))steps.push('重複、ピンぼけ、期限切れだけを削除候補にする');
    if(checked('include_next'))steps.push('次回見る日をひとつ決める');
    var title=month+'の写真見直しメモ';
    var html='<p class="meta">対象: '+month+' / 重視: '+focusNames[focus]+' / 目安: '+time+'分</p><div class="output-list">';
    steps.forEach(function(step){html+='<label><input type="checkbox"> '+step+'</label>'});
    html+='</div><p class="note">削除に迷う写真は残します。今日は分類を進めることを優先します。</p>';
    if(memo)html+='<p><strong>メモ:</strong> '+memo+'</p>';
    el('result').innerHTML=html;
    el('copy_text').value=title+'\n重視: '+focusNames[focus]+'\n目安: '+time+'分\n\n'+steps.map(function(step,index){return (index+1)+'. '+step}).join('\n')+'\n\n削除に迷う写真は残す。'+(memo?'\n\nメモ: '+memo:'');
  }
  function copyText(){
    var target=el('copy_text');
    var status=el('status');
    if(!target.value)build();
    if(navigator.clipboard&&navigator.clipboard.writeText){
      navigator.clipboard.writeText(target.value).then(function(){status.textContent='コピーしました。'}).catch(function(){target.focus();target.select();status.textContent='自動コピーできませんでした。テキスト欄を手動でコピーしてください。'})
    }else{
      target.focus();target.select();status.textContent='この環境では手動コピーを使ってください。'
    }
  }
  el('generate').addEventListener('click',build);
  el('copy').addEventListener('click',copyText);
  el('print').addEventListener('click',function(){window.print()});
  build();
})();
</script>
</body>
</html>
